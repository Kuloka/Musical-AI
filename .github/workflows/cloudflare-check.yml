name: Check Cloudflare website
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public Cloudflare page and assets
        run: |
          node <<'JS'
          const fs = require('fs');
          (async () => {
            const base = 'https://musical-ai.pages.dev/';
            for (const file of ['index.html', 'site-core.js', 'site.js', 'render.js', 'locales.js', 'locales-west.js', 'locales-east.js', 'effects.js', 'effects.css', 'assets/app.png']) {
              const url = base + (file === 'index.html' ? '' : file);
              const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
              console.log(response.status + ' ' + url);
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const actual = Buffer.from(await response.arrayBuffer());
              const expected = fs.readFileSync('docs/' + file);
              if (!actual.equals(expected)) throw new Error('Content differs: ' + file);
            }
            console.log('PASS: Cloudflare serves the current English page and all language/effect assets.');
          })().catch(error => { console.error(error.message, error.cause?.code || ''); process.exitCode = 1; });
          JS
      - name: Install browser checker
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" playwright
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Load Cloudflare in desktop and mobile browsers
        env:
          NODE_PATH: ${{ runner.temp }}/browser-check/node_modules
        run: node .github/scripts/cloudflare-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-browser-check
          path: artifacts/cloudflare-browser/
